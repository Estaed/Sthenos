/* ---------- colour: dark (Tarik Base v6, pure neutrals, C = 0) ---------- */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --page: #050505;            /* outside the phone only */
  --ground: #0E0E0E;          /* canvas */
  --card: #191919;            /* surface-1: one pair = one card */
  --card-line: #262626;       /* card hairline */
  --divider: #2A2A2A;         /* between the two rows of a pair */
  --tonal: #2E2E2E;           /* surface-3: selected segment, Finish */
  --outline: #6B6B6B;         /* hairline-strong: segmented border, clock pill */
  --ink: #EEEEEE;
  --ink-muted: #ABABAB;
  --ink-subtle: #8C8C8C;
  /* set cells */
  --cell-done-bg: #2E2E2E;    --cell-done-ink: #EEEEEE;
  --cell-short-bg: #2E2E2E;   --cell-short-ink: #EEEEEE;   --cell-short-of: #ABABAB;
  --cell-todo-line: #686868;  --cell-todo-ink: #8C8C8C;
  --cell-now-ring: #FF5A00;   --cell-now-bg: transparent;  --cell-now-ink: #EEEEEE;
  /* trend line */
  --spark: #767676;           /* earlier weeks */
  --spark-now: #FF5A00;       /* this week, once logged */
  /* accent */
  --primary: #FF5A00;         /* ring, bar, the current tab's check */
  --primary-text: #FF6A1A;    /* orange text under 24px */
  /* docked sheet and its controls */
  --sheet: #1F1F1F;
  --sheet-line: #333333;
  --sheet-shadow: none;
  --pick-bg: #2E2E2E;         --pick-ink: #EEEEEE;
  --action: #EEEEEE;          --on-action: #0E0E0E;      /* the one-tap log button */
  /* the anchor box (score bug) */
  --anchor: #EEEEEE;  --on-anchor: #121212;  --on-anchor-muted: #5B5B5B;  --on-anchor-accent: #C23C00;
  --anchor-rule: #CFCFCF;     --slab: #3D3D3D;
}

/* ---------- colour: light ---------- */
:root[data-theme="light"] {
  color-scheme: light;
  --page: #DADADA;
  --ground: #F7F7F7;
  --card: #FFFFFF;
  --card-line: #E3E3E3;
  --divider: #EBEBEB;
  --tonal: #EBEBEB;
  --outline: #8A8A8A;
  --ink: #121212;
  --ink-muted: #5B5B5B;
  --ink-subtle: #6C6C6C;
  --cell-done-bg: #EBEBEB;    --cell-done-ink: #121212;
  --cell-short-bg: #EBEBEB;   --cell-short-ink: #121212;   --cell-short-of: #5B5B5B;
  --cell-todo-line: #8F8F8F;  --cell-todo-ink: #6C6C6C;
  --cell-now-ring: #D34303;   --cell-now-bg: transparent;  --cell-now-ink: #121212;
  --spark: #8C8C8C;
  --spark-now: #D34303;
  --primary: #D34303;
  --primary-text: #C23C00;
  --sheet: #FFFFFF;
  --sheet-line: #E3E3E3;
  --sheet-shadow: 0 -8px 24px #12121214;
  --pick-bg: #F0F0F0;         --pick-ink: #121212;
  --action: #121212;          --on-action: #FFFFFF;
  --anchor: #121212;  --on-anchor: #EEEEEE;  --on-anchor-muted: #ABABAB;  --on-anchor-accent: #FF6A1A;
  --anchor-rule: #383838;     --slab: #12121259;
}

/* ---------- type and size ---------- */
:root {
  --font-text: 'Schibsted Grotesk', system-ui, sans-serif;  /* every word */
  --font-num: 'Schibsted Grotesk', system-ui, sans-serif;   /* every number: the same face, heavier */
  --num-stretch: 100%;        /* Schibsted has no width axis */
  --num-stretch-big: 100%;
  --num-weight: 800;
  --num-weight-big: 900;

  --fs-title: 20px;           /* Week 1 */
  --fs-tab: 14px;             /* segmented day button, Finish */
  --fs-clock: 15px;
  --fs-name: 14.5px;          /* exercise name */
  --fs-meta: 12px;            /* load, range, tag */
  --fs-col: 12px;             /* column labels over the day */
  --fs-last: 12px;            /* last week's sets under the trend line */
  --fs-cell: 19px;            /* set numbers */
  --fs-cell-of: 11px;         /* the /12 of a short set */
  --fs-tile-label: 12px;      /* timed rows */
  --fs-tile-val: 16px;
  --fs-bug-name: 17px;
  --fs-bug-meta: 13px;
  --fs-bug-label: 12px;
  --fs-bug-num: 40px;
  --fs-bug-of: 22px;          /* the /3 */
  --fs-pick: 19px;
  --fs-log: 26px;

  --margin: 8px;              /* screen edge to card */
  --gap-cards: 4px;
  --radius-card: 16px;
  --radius-cell: 12px;
  --row-h: 45px;
  --cell-w: 42px;
  --cell-h: 40px;
  --cell-gap: 4px;
  --trend-w: 44px;
  --sheet-radius: 24px;
  --anchor-radius: 14px;
  --slab-x: 6px;  --slab-y: 7px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font-family: var(--font-text); -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: grid; place-items: center; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-family: var(--font-num); font-stretch: var(--num-stretch); font-weight: var(--num-weight); font-variant-numeric: tabular-nums; }

.phone { width: 360px; height: 780px; position: relative; overflow: hidden; background: var(--ground);
  display: flex; flex-direction: column; }

/* ---------- top app bar ---------- */
.appbar { height: 44px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px 0 2px; }
.week { height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 6px 0 12px; border-radius: 22px;
  font-size: var(--fs-title); font-weight: 700; letter-spacing: -.3px; }
.week .i { width: 18px; height: 18px; color: var(--ink-muted); }
.clock { margin-left: auto; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 9px;
  border: 1px solid var(--outline); border-radius: 16px; }
.clock .i { width: 16px; height: 16px; color: var(--ink-muted); }
.clock .num { font-size: var(--fs-clock); letter-spacing: .1px; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px; color: var(--ink-muted); flex: none; }
.finish { height: 40px; padding: 0 16px; border-radius: 20px; background: var(--tonal); font-size: var(--fs-tab); font-weight: 700; }

/* ---------- segmented day button ---------- */
.days { flex: none; margin: 2px var(--margin) 0; height: 44px; display: grid; grid-template-columns: 1.15fr 1fr 1fr;
  border: 1px solid var(--outline); border-radius: 22px; overflow: hidden; }
.days button { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--fs-tab); font-weight: 600;
  color: var(--ink-muted); border-left: 1px solid var(--outline); }
.days button:first-child { border-left: 0; }
.days button[aria-pressed="true"] { background: var(--tonal); color: var(--ink); font-weight: 700; }
.days button[aria-pressed="true"] .i { width: 18px; height: 18px; color: var(--primary); stroke-width: 2.4; }

/* ---------- the day ---------- */
.day { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--margin) 2px; display: flex; flex-direction: column; gap: var(--gap-cards);
  scrollbar-width: none; }
.cards { display: flex; flex-direction: column; gap: var(--gap-cards); }
.card { background: var(--card); border: 1px solid var(--card-line); border-radius: var(--radius-card); padding: 1px 0; flex: none; }
.row { height: var(--row-h); display: grid; align-items: center; column-gap: 6px; padding: 0 3px 0 12px;
  grid-template-columns: minmax(0, 1fr) var(--trend-w) calc(3 * var(--cell-w) + 2 * var(--cell-gap)); }
.row + .row { border-top: 1px solid var(--divider); }
.cols { height: 16px; flex: none; margin-bottom: -3px; font-size: var(--fs-col); font-weight: 600; color: var(--ink-subtle); line-height: 14px; }
.cols.row { align-items: end; padding-bottom: 1px; }
.cols span:nth-child(2) { text-align: center; margin-right: 2px; white-space: nowrap; }
.cols span:nth-child(3) { padding-left: 2px; }
.ex { min-width: 0; }
.name { font-size: var(--fs-name); font-weight: 700; line-height: 19px; letter-spacing: -.1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { display: flex; align-items: center; gap: 6px; margin-top: 1px; font-size: var(--fs-meta); line-height: 16px; color: var(--ink-muted);
  font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meta .load { color: var(--ink); font-weight: 700; }
.tag { height: 18px; display: inline-flex; align-items: center; padding: 0 5px; border-radius: 6px; border: 1px solid var(--primary);
  color: var(--primary-text); font-weight: 700; margin-left: 1px; }

.trend { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-right: 2px; }
.spark { display: block; overflow: visible; }
.spark .base { stroke: var(--divider); stroke-width: 1; }
.spark .ln { fill: none; stroke: var(--spark); stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
.spark .plan { stroke-dasharray: 2 2.5; }
.spark .dot { fill: var(--spark); }
.spark .now { fill: var(--spark-now); stroke: var(--card); stroke-width: 1.5; }
.spark .tgt { fill: var(--card); stroke: var(--spark); stroke-width: 1.3; }
.last { font-size: var(--fs-last); line-height: 14px; color: var(--ink-subtle); font-weight: 600; white-space: nowrap;
  font-variant-numeric: tabular-nums; letter-spacing: -.1px; }

.cells { display: grid; grid-template-columns: repeat(3, var(--cell-w)); gap: var(--cell-gap); justify-content: end; }
.c { width: var(--cell-w); height: var(--cell-h); border-radius: var(--radius-cell); display: grid; place-items: center;
  font-size: var(--fs-cell); position: relative; }
.c::after { content: ""; position: absolute; inset: -3px -2px; }   /* 46 x 46 touch area */
.c.done  { background: var(--cell-done-bg); color: var(--cell-done-ink); }
.c.short { background: var(--cell-short-bg); color: var(--cell-short-ink); }
.c.short small { font-size: var(--fs-cell-of); font-weight: 600; color: var(--cell-short-of); font-stretch: 100%; margin-left: 1px; }
.c.todo  { box-shadow: inset 0 0 0 1.5px var(--cell-todo-line); color: var(--cell-todo-ink); font-weight: 600; }
.c.now   { background: var(--cell-now-bg); box-shadow: inset 0 0 0 2px var(--cell-now-ring); color: var(--cell-now-ink); }
.c.sec small { font-family: var(--font-text); font-size: var(--fs-cell-of); font-weight: 700; margin-left: 1px; }
.c.void  { visibility: hidden; }

.timed { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 3px 3px 2px 12px; border-top: 1px solid var(--divider); }
.tile { height: 44px; border-radius: var(--radius-cell); box-shadow: inset 0 0 0 1.5px var(--cell-todo-line); display: flex; align-items: center;
  gap: 8px; padding: 0 10px; text-align: left; min-width: 0; }
.tile .i { width: 18px; height: 18px; color: var(--ink-muted); }
.tile > span { display: flex; flex-direction: column; min-width: 0; }
.tile .lbl { font-size: var(--fs-tile-label); color: var(--ink-muted); font-weight: 600; line-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .val { font-size: var(--fs-tile-val); line-height: 20px; white-space: nowrap; }
.tile .val em { font-family: var(--font-text); font-style: normal; font-weight: 600; font-size: var(--fs-tile-label); color: var(--ink-muted); margin-left: 5px; }

/* ---------- docked sheet: score bug + one-tap log ---------- */
.sheet { flex: none; background: var(--sheet); border-top: 1px solid var(--sheet-line); box-shadow: var(--sheet-shadow);
  border-radius: var(--sheet-radius) var(--sheet-radius) 0 0; padding: 7px var(--margin) 8px; }
.bug { background: var(--anchor); color: var(--on-anchor); border-radius: var(--anchor-radius); overflow: hidden;
  box-shadow: var(--slab-x) var(--slab-y) 0 var(--slab); margin-right: var(--slab-x); }
.bug-head { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 0 0 14px; }
.bug-name { font-size: var(--fs-bug-name); font-weight: 800; letter-spacing: -.3px; }
.bug-meta { margin-left: auto; display: flex; gap: 8px; font-size: var(--fs-bug-meta); font-weight: 700; color: var(--on-anchor-muted);
  font-variant-numeric: tabular-nums; }
.bug-edit { width: 44px; height: 44px; margin: -7px 0; display: grid; place-items: center; color: var(--on-anchor-muted); }
.bug-edit .i { width: 18px; height: 18px; }
.score { display: grid; grid-template-columns: .92fr .8fr 1.38fr; }
.score > div { padding: 0 14px 8px; display: flex; flex-direction: column; }
.score > div + div { border-left: 2px solid var(--anchor-rule); }
.lab { font-size: var(--fs-bug-label); font-weight: 700; color: var(--on-anchor-muted); line-height: 14px; display: flex; justify-content: space-between; }
.big { font-family: var(--font-num); font-stretch: var(--num-stretch-big); font-weight: var(--num-weight-big); font-size: var(--fs-bug-num);
  line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: 4px; white-space: nowrap; }
.big small { font-size: var(--fs-bug-of); font-weight: 700; color: var(--on-anchor-muted); letter-spacing: 0; }
.rest .big { color: var(--on-anchor-accent); }
.bar { height: 5px; background: var(--anchor-rule); }
.bar i { display: block; height: 100%; width: var(--rest-left, 80%); background: var(--on-anchor-accent); }

.pick { margin-top: calc(var(--slab-y) + 6px); height: 50px; display: grid; gap: 6px;
  grid-template-columns: 44px 44px 44px minmax(0, 1fr) 44px 44px; }
.pick button { border-radius: 12px; background: var(--pick-bg); color: var(--pick-ink); font-size: var(--fs-pick); }
.pick .log { background: var(--action); color: var(--on-action); display: flex; align-items: center; justify-content: center; gap: 4px;
  font-size: var(--fs-log); font-stretch: var(--num-stretch-big); font-weight: var(--num-weight-big); }
.pick .log .i { width: 22px; height: 22px; stroke-width: 2.8; }

/* Schibsted's tabular figures set the colon and the point on a full digit width ("0 : 23", "47 .5"):
   static numbers keep proportional figures, ticking timers keep tabular digits with a proportional colon. */
.meta, .tag, .tile .val em, .bug-meta { font-variant-numeric: proportional-nums; }
.pn { font-variant-numeric: proportional-nums; }

/* theme switch: outside the phone only */
.theme { position: fixed; top: 16px; right: 16px; height: 44px; padding: 0 16px; border-radius: 22px; background: var(--tonal);
  font-size: 14px; font-weight: 700; display: none; }
@media (min-width: 480px) { .theme { display: block; } }
</style>
</head>
<body>
<button class="theme" type="button" id="theme">Light / dark</button>

<main class="phone" aria-label="A Heavy workout">
  <header class="appbar">
    <button class="week" type="button" aria-label="Week 1, change week">Week 1 <svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="clock" role="timer" aria-label="Session time 23 minutes 41 seconds">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>
      <span class="num">0<span class="pn">:</span>23<span class="pn">:</span>41</span>
    </div>
    <button class="iconbtn" type="button" aria-label="Saved on this phone; syncs when you finish">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 13v8"/><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="m8 17 4-4 4 4"/></svg>
    </button>
    <button class="finish" type="button">Finish</button>
  </header>

  <nav class="days" aria-label="Day">
    <button type="button" aria-pressed="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>A Heavy</button>
    <button type="button" aria-pressed="false">B Volume</button>
    <button type="button" aria-pressed="false">C Legs</button>
  </nav>

  <section class="day" aria-label="Exercises">
    <div class="row cols" aria-hidden="true"><span></span><span>Last wk</span><span>This week</span></div>
    <div id="day" class="cards"></div>
  </section>

  <section class="sheet" aria-label="Log the current set">
    <div class="bug" role="group" aria-label="Current set">
      <div class="bug-head">
        <span class="bug-name">Leg Press</span>
        <span class="bug-meta"><span>110 kg</span><span>8–12</span></span>
        <button class="bug-edit" type="button" aria-label="Other reps or load">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
        </button>
      </div>
      <div class="score">
        <div><span class="lab">Set</span><span class="big">2<small>/3</small></span></div>
        <div><span class="lab">Reps</span><span class="big">10</span></div>
        <div class="rest" role="timer" aria-label="Pair rest, 1 minute 12 seconds left of 1:30"><span class="lab"><span>Pair rest</span><span>of 1:30</span></span><span class="big">1<span class="pn">:</span>12</span></div>
      </div>
      <div class="bar" aria-hidden="true"><i></i></div>
    </div>
    <div class="pick" role="group" aria-label="Reps done">
      <button type="button" class="num" aria-label="Log 7 reps">7</button>
      <button type="button" class="num" aria-label="Log 8 reps">8</button>
      <button type="button" class="num" aria-label="Log 9 reps">9</button>
      <button type="button" class="num log" aria-label="Log the target, 10 reps"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>10</button>
      <button type="button" class="num" aria-label="Log 11 reps">11</button>
      <button type="button" class="num" aria-label="Log 12 reps">12</button>
    </div>
  </section>
</main>

<script>
/* The day: week 1, day A, from calisthenics-data.json. Each set is {t: target} or {t, r: result};
   now marks the current set. last = last week's sets; trend = avg reps per set for the three weeks
   before this one (the last of them is last week). Weeks before week 1 are invented. */
var DAY = [
  [ { name: 'Weighted Pull-up', load: 'BW', range: '4–6', tag: '+2.5 kg next',
      sets: [{t: 6, r: 6}, {t: 6, r: 6}, {t: 6, r: 6}], last: [6, 6, 5], trend: [4.7, 5.3, 5.7] },
    { name: 'Weighted Dip', load: 'BW', range: '6–10',
      sets: [{t: 8, r: 8}, {t: 8, r: 8}, {t: 8, r: 8}], last: [8, 8, 7], trend: [7, 7.3, 7.7] } ],
  [ { name: 'Leg Press', load: '110 kg', range: '8–12',
      sets: [{t: 10, r: 10}, {t: 10, now: true}, {t: 10}], last: [10, 10, 9], trend: [9, 9.3, 9.7] },
    { name: 'Side Lateral Raise', load: '5 kg', range: '12–20',
      sets: [{t: 12, r: 9}, {t: 12}], last: [12, 11], trend: [11, 11, 11.5] } ],
  [ { name: 'Machine Row', load: '60 kg', range: '8–12',
      sets: [{t: 10}, {t: 10}], last: [10, 9], trend: [8.5, 9, 9.5] },
    { name: 'Shoulder Press', load: '47.5 kg', range: '8–12',
      sets: [{t: 10}, {t: 10}], last: [9, 8], trend: [8, 8, 8.5] } ],
  [ { name: 'Seated Leg Curl', load: '35 kg', range: '10–15',
      sets: [{t: 12}, {t: 12}, {t: 12}], last: [12, 11, 11], trend: [10.7, 11, 11.3] },
    { name: 'Standing Calf Raise', load: '77.5 kg', range: '12–15',
      sets: [{t: 12}, {t: 12}], last: [12, 12], trend: [11, 11.5, 12] } ],
  [ { name: 'Plank', load: 'BW', range: 'hold', unit: 's',
      sets: [{t: 40}, {t: 40}], last: [40, 35], trend: [30, 35, 37.5] } ]
];
var TIMED = [
  { name: 'Hamstring stretch', val: '4 min' },
  { name: 'Incline walk 6%', val: '22 min', note: '5.0 km/h' }
];

var ICON_TIMER = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>';

function avg(a) { return a.reduce(function (s, v) { return s + v; }, 0) / a.length; }
function round1(v) { return Math.round(v * 10) / 10; }

/* 4-point trend: three earlier weeks in grey, this week orange once a set is logged,
   otherwise a dashed line to a hollow target point. */
function spark(ex) {
  var logged = ex.sets.filter(function (s) { return s.r != null; }).map(function (s) { return s.r; });
  var now = logged.length ? avg(logged) : avg(ex.sets.map(function (s) { return s.t; }));
  var vals = ex.trend.concat([now]);
  var W = 40, H = 16, P = 2.5, xs = [2, 14, 26, 38];
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  var span = Math.max(hi - lo, ex.unit === 's' ? 8 : 1.5), mid = (hi + lo) / 2;
  function y(v) { return (P + (H - 2 * P) * (1 - (v - (mid - span / 2)) / span)).toFixed(1); }
  var pts = vals.map(function (v, i) { return xs[i] + ',' + y(v); });
  var u = ex.unit === 's' ? ' s' : '';
  var label = 'Average per set, three weeks before: ' + ex.trend.map(round1).join(', ') + u +
    (logged.length ? '; this week so far ' : '; this week planned ') + round1(now) + u;
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + label + '">' +
    '<title>' + label + '</title>' +
    '<line class="base" x1="0" x2="' + W + '" y1="' + (H - .5) + '" y2="' + (H - .5) + '"/>' +
    '<polyline class="ln" points="' + pts.slice(0, 3).join(' ') + '"/>' +
    '<polyline class="ln' + (logged.length ? '' : ' plan') + '" points="' + pts.slice(2).join(' ') + '"/>' +
    pts.slice(0, 3).map(function (p) { p = p.split(','); return '<circle class="dot" cx="' + p[0] + '" cy="' + p[1] + '" r="1.6"/>'; }).join('') +
    (function (p) { p = p.split(','); return logged.length
      ? '<circle class="now" cx="' + p[0] + '" cy="' + p[1] + '" r="3"/>'
      : '<circle class="tgt" cx="' + p[0] + '" cy="' + p[1] + '" r="2.3"/>'; })(pts[3]) +
    '</svg>';
}

function cell(s, i, ex) {
  var unit = ex.unit === 's' ? '<small>s</small>' : '';
  function v(x) { return '<span>' + x + unit + '</span>'; }
  var cls = 'c num' + (ex.unit === 's' ? ' sec' : '');
  var n = 'Set ' + (i + 1) + ': ';
  if (s.now) return '<button type="button" class="' + cls + ' now" aria-current="step" aria-label="' + n + 'current, target ' + s.t + '">' + v(s.t) + '</button>';
  if (s.r == null) return '<button type="button" class="' + cls + ' todo" aria-label="' + n + 'target ' + s.t + '">' + v(s.t) + '</button>';
  if (s.r < s.t) return '<button type="button" class="' + cls + ' short" aria-label="' + n + s.r + ' of ' + s.t + ', short"><span>' + s.r + '<small>/' + s.t + '</small></span></button>';
  return '<button type="button" class="' + cls + ' done" aria-label="' + n + s.r + ', done">' + v(s.r) + '</button>';
}

function row(ex) {
  var cells = ex.sets.map(function (s, i) { return cell(s, i, ex); });
  while (cells.length < 3) cells.push('<span class="c void" aria-hidden="true"></span>');
  var u = ex.unit === 's' ? 's' : '';
  return '<div class="row">' +
    '<div class="ex"><div class="name">' + ex.name + '</div>' +
      '<div class="meta"><span class="load">' + ex.load + '</span><span>' + ex.range + '</span>' +
      (ex.tag ? '<span class="tag">' + ex.tag + '</span>' : '') + '</div></div>' +
    '<div class="trend">' + spark(ex) + '<span class="last" aria-label="Last week ' + ex.last.join(', ') + '">' +
      ex.last.map(function (v) { return v + u; }).join(' ') + '</span></div>' +
    '<div class="cells">' + cells.join('') + '</div>' +
  '</div>';
}

function tile(t) {
  return '<button type="button" class="tile">' + ICON_TIMER + '<span><span class="lbl">' + t.name + '</span>' +
    '<span class="val num">' + t.val + (t.note ? '<em>' + t.note + '</em>' : '') + '</span></span></button>';
}

document.getElementById('day').innerHTML = DAY.map(function (group, gi) {
  var last = gi === DAY.length - 1;
  return '<div class="card">' + group.map(row).join('') +
    (last ? '<div class="timed">' + TIMED.map(tile).join('') + '</div>' : '') + '</div>';
}).join('');

var root = document.documentElement;
if (location.hash === '#light') root.setAttribute('data-theme', 'light');
document.getElementById('theme').addEventListener('click', function () {
  root.setAttribute('data-theme', root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
});
</script>
</body>
</html>
