<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notebook prototype</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="fonts/archivo.css">
<style>
  /* Calisthenics round 3, concept "Notebook" (2026-10-24). A lifter's paper logbook made fast: one row per
     exercise, the sets as numbers, last week's numbers in the same columns underneath, a reps pad docked
     at the bottom. Tarik Base v6 (tokens.css copied unchanged) + the Pantry layer. Prototype state lives in
     localStorage under cali-proto-notebook-v1 only; the real data and sync are never touched. */
  @font-face { font-family: Manrope; src: url(fonts/Manrope.woff2) format('woff2'); font-weight: 200 800; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #161616; color: var(--ink); font: 500 16px/1.5 var(--font-sans); display: flex; justify-content: center; align-items: flex-start; gap: 40px; padding: 32px 24px; }
  [data-theme="light"] body { background: #E4E4E4; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .disp { font-family: var(--font-display); font-weight: 700; font-stretch: var(--display-stretch); }

  /* page around the phone (desktop only) */
  .side { width: 340px; color: var(--ink-muted); font-size: 14px; }
  .side h1 { font: 700 30px/1.08 var(--font-display); font-stretch: var(--display-stretch); letter-spacing: -0.5px; color: var(--ink); margin: 0 0 14px; }
  .side .seg { margin: 0 0 20px; max-width: 220px; }
  .about h2, .sheet .about h2 { font: 700 15px/1.3 var(--font-sans); letter-spacing: 0; color: var(--ink); margin: 18px 0 6px; }
  .about li { text-wrap: pretty; }
  .facts { display: flex; margin: 0 0 18px; }
  .facts > div { flex: 1; } .facts > div + div { border-left: 1px solid var(--hairline); padding-left: 14px; }
  .facts span { display: block; font: 600 12px/1.3 var(--font-sans); color: var(--ink-muted); }
  .facts b { display: block; font: 700 18px/1.3 var(--font-figure); margin-top: 2px; }
  .about ul { margin: 0; padding-left: 18px; }
  .about li { margin: 0 0 6px; font-size: 14px; line-height: 1.45; color: var(--ink-muted); }
  .about li b { color: var(--ink); font-weight: 700; }

  /* the phone */
  .phone { width: 360px; height: 780px; flex: none; background: var(--canvas); border: 1px solid #3A3A3A; border-radius: 32px; overflow: hidden; position: relative; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
  [data-theme="light"] .phone { border-color: #C8C8C8; }
  @media (max-width: 760px) {
    body { padding: 0; display: block; }
    .phone { width: 100vw; height: 100vh; height: 100dvh; border: 0; border-radius: 0; }
    .side { display: none; }
  }

  /* top: week strip + icons, then the day control */
  .top { display: flex; align-items: center; gap: 4px; padding: 8px 6px 0 12px; height: 52px; flex: none; }
  .weeks { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .weeks::-webkit-scrollbar { display: none; }
  .weeks .grp { font: 600 12px var(--font-sans); color: var(--ink-subtle); padding: 0 4px 0 6px; white-space: nowrap; }
  .weeks .grp:first-child { padding-left: 0; }
  .wk { height: 44px; min-width: 40px; padding: 0 9px; border-radius: var(--r-chip); font: 700 14px var(--font-sans); color: var(--ink-muted); position: relative; flex: none; display: grid; place-items: center; }
  .wk.old { font-weight: 600; color: var(--ink-subtle); }
  .wk.on { color: var(--on-action); }
  .wk.on::before { content: ""; position: absolute; inset: 6px 0; border-radius: var(--r-chip); background: var(--action); z-index: 0; }
  .wk span { position: relative; z-index: 1; }
  .wk.live::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 3px; height: 2px; border-radius: 2px; background: var(--primary); }
  .ib { width: 44px; height: 44px; border-radius: var(--r-md); display: grid; place-items: center; color: var(--ink); flex: none; position: relative; }
  .ib:active { background: var(--surface-2); }
  .ib.on { background: var(--action); color: var(--on-action); }
  .ib[disabled] { color: var(--ink-subtle); opacity: .5; cursor: default; }
  .ib .dot { position: absolute; top: 10px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--canvas); }
  .seg { display: flex; background: var(--surface-2); border-radius: var(--r-button); padding: 3px; height: 44px; gap: 2px; }
  .seg button { flex: 1; min-width: 0; border-radius: 9px; font: 600 14px var(--font-sans); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .seg button.on { background: var(--action); color: var(--on-action); }
  .days { padding: 4px 12px 0; flex: none; }
  .days .seg button.done::after { content: " \2713"; }

  /* the notebook */
  .table { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 12px 20px; scroll-padding-bottom: 12px; }
  .colhead { position: sticky; top: 0; z-index: 2; background: var(--canvas); align-items: end; display: grid; grid-template-columns: 1fr 46px var(--cw); gap: 8px; padding: 8px 0 4px 10px; font: 600 12px var(--font-sans); color: var(--ink-subtle); border-bottom: 1px solid var(--hairline); }
  .colhead .sets { display: flex; gap: 6px; }
  .colhead .sets span { width: 44px; text-align: center; }
  .colhead .ld { text-align: right; }
  .grp-ex { position: relative; border-bottom: 1px solid var(--hairline); }
  .grp-ex.pair::before { content: ""; position: absolute; left: 1px; top: 14px; bottom: 14px; width: 2px; border-radius: 2px; background: var(--hairline-strong); }
  .row { display: grid; grid-template-columns: 1fr 46px var(--cw); gap: 8px; padding: 6px 0 6px 10px; align-items: start; }
  .grp-ex.pair .row + .row { border-top: 1px dashed var(--hairline); }
  .nm { text-align: left; min-height: 44px; padding: 3px 0 0; display: flex; flex-direction: column; justify-content: flex-start; min-width: 0; }
  .nm b { font: 700 14px/1.25 var(--font-sans); color: var(--ink); overflow-wrap: anywhere; }
  .nm small { font: 500 12px/1.35 var(--font-sans); color: var(--ink-muted); margin-top: 2px; }
  .ld { text-align: right; padding-top: 7px; display: flex; flex-direction: column; align-items: flex-end; }
  .ld b { font: 700 14px/1.2 var(--font-figure); }
  .ld i { font: 600 12px/1.2 var(--font-figure); font-style: normal; color: var(--ink-subtle); margin-top: 10px; white-space: nowrap; }
  .ld i.up { color: var(--ink-muted); }
  .sets { display: flex; gap: 6px; }
  .setc { width: 44px; display: flex; flex-direction: column; align-items: stretch; }
  .cell { height: 34px; border-radius: var(--r-sm); border: 1px solid var(--hairline-strong); display: grid; place-items: center; font: 500 15px/1 var(--font-figure); color: var(--ink-subtle); position: relative; }
  [data-theme="light"] .cell { border-color: #C4C4C4; }
  .setc > i { font: 600 12px/1 var(--font-figure); font-style: normal; color: var(--ink-subtle); text-align: center; margin-top: 4px; height: 14px; }
  .setc > i.beat { color: var(--ink); }
  .cell.v { background: var(--surface-3); border-color: transparent; color: var(--ink); font: 700 17px/1 var(--font-figure); }
  .cell.v small { font: 600 11px/1 var(--font-figure); color: var(--ink-muted); margin-left: 1px; }
  .cell.v.sh { display: flex; justify-content: center; align-items: baseline; padding-top: 9px; }
  .cell.cur { border-color: transparent; color: var(--ink-muted); box-shadow: inset 0 0 0 2px var(--primary); }
  .cell.sel { box-shadow: inset 0 0 0 2px var(--primary); }
  .cell.pend { color: var(--ink); font-weight: 700; }
  .cell.pend::after { content: ""; width: 2px; height: 16px; background: var(--ink); margin-left: 2px; animation: blink 1s steps(2) infinite; }
  .cell.pend { display: flex; justify-content: center; align-items: center; }
  @keyframes blink { 50% { opacity: 0; } }
  .cell.swap { animation: swap var(--dur-base) var(--ease-enter); }
  @keyframes swap { from { transform: translateY(var(--rise)); opacity: 0.2; } }
  .setc[disabled] .cell { cursor: default; }
  .lastshort { grid-column: 3; font: 600 12px var(--font-sans); color: var(--ink-subtle); margin-top: -2px; }
  .once .nm b { font-weight: 700; }
  .once .wide { width: 100%; }
  .once .wide .cell { font-size: 14px; }
  .once .wide .cell .in { display: inline-flex; align-items: center; gap: 4px; }
  .once .wide .cell svg { width: 16px; height: 16px; }
  .endrow { padding: 16px 0 4px; }
  .empty-day { text-align: center; padding: 48px 20px; color: var(--ink-muted); font-size: 14px; }
  .empty-day .circ { width: 88px; height: 88px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; margin: 0 auto 14px; color: var(--ink-muted); }
  .empty-day .circ svg { width: 40px; height: 40px; }

  /* buttons */
  .btn { width: 100%; min-height: 48px; border-radius: var(--r-button); background: var(--action); color: var(--on-action); font: 700 16px/1.2 var(--font-sans); display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; transition: transform var(--dur-fast) var(--ease-enter); }
  .btn:active { transform: scale(0.98); background: var(--action-pressed); }
  .btn.sec { background: var(--surface-2); color: var(--ink); }
  .btn.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
  .btn-row { display: flex; gap: 10px; }

  /* dock: the reps pad */
  .dock { flex: none; background: var(--surface-1); border-top: 1px solid var(--hairline); padding: 8px 8px 10px; }
  .padhead { display: flex; align-items: center; gap: 6px; min-height: 56px; }
  .who { flex: 1; min-width: 0; text-align: left; display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 6px; min-height: 48px; border-radius: var(--r-md); }
  .who > span { min-width: 0; display: flex; flex-direction: column; }
  .who b { font: 700 14px/1.25 var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who small { font: 500 12px/1.35 var(--font-sans); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who svg { color: var(--ink-muted); width: 18px; height: 18px; }
  .timer { height: 48px; min-width: 64px; padding: 0 8px; border-radius: var(--r-md); background: var(--surface-2); display: flex; align-items: center; justify-content: center; gap: 4px; font: 700 15px var(--font-figure); color: var(--ink); }
  .timer svg { width: 16px; height: 16px; color: var(--ink-muted); }
  .timer.idle { color: var(--ink-muted); font-weight: 600; font-size: 13px; }
  .timer.go { box-shadow: inset 0 0 0 2px var(--ink); }
  .okkey { height: 56px; min-width: 92px; padding: 0 12px; border-radius: var(--r-button); background: var(--action); color: var(--on-action); display: flex; align-items: center; justify-content: center; gap: 6px; transition: transform var(--dur-fast) var(--ease-enter); }
  .okkey:active { transform: scale(0.98); background: var(--action-pressed); }
  .okkey .disp { font-size: 26px; line-height: 1; letter-spacing: -0.5px; }
  .okkey small { font: 700 14px var(--font-sans); }
  .okkey.clear { background: var(--surface-2); color: var(--ink); }
  .keys { display: grid; grid-template-columns: 44px repeat(5, 1fr); gap: 6px; margin-top: 6px; }
  .keys button { height: 52px; border-radius: var(--r-md); background: var(--surface-2); font: 700 24px/1 var(--font-display); font-stretch: var(--display-stretch); color: var(--ink); display: grid; place-items: center; }
  .keys button:active { background: var(--surface-3); }
  .keys button.un { grid-row: span 2; height: auto; background: transparent; box-shadow: inset 0 0 0 1px var(--hairline); color: var(--ink-muted); }
  .keys button.un[disabled] { opacity: .4; cursor: default; }
  .finbar { display: flex; gap: 8px; align-items: center; }
  .finbar .btn { flex: 1; min-height: 56px; }
  .pastbar { display: flex; gap: 10px; align-items: center; padding: 4px 4px 2px; }
  .pastbar p { flex: 1; margin: 0; font: 500 13px/1.4 var(--font-sans); color: var(--ink-muted); }
  .pastbar .btn { width: auto; flex: none; }

  /* edit mode */
  .daybar { display: flex; gap: 6px; align-items: center; padding: 10px 0 6px; }
  .daybar input { flex: 1; min-width: 0; }
  .field { background: var(--surface-2); border: 0; border-radius: var(--r-md); min-height: 44px; padding: 10px 12px; font: 600 15px var(--font-sans); color: var(--ink); width: 100%; }
  .field:focus { outline: 2px solid var(--primary); outline-offset: 0; }
  .erow { display: grid; grid-template-columns: 44px 1fr 44px; gap: 4px; padding: 4px 0; align-items: center; }
  .erow .mv { display: flex; flex-direction: column; }
  .erow .mv .ib { height: 30px; }
  .erow .nm { justify-content: center; padding: 6px 0; }
  .erow.open .nm b { color: var(--ink); }
  .editor { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: var(--r-card); padding: 12px; margin: 0 0 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; }
  .editor .full { grid-column: 1 / -1; }
  .editor label { display: block; font: 700 13px/1.3 var(--font-sans); color: var(--ink); margin-bottom: 6px; }
  .stepper { display: flex; align-items: center; background: var(--surface-2); border-radius: var(--r-md); height: 44px; }
  .stepper button { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); }
  .stepper b { flex: 1; text-align: center; font: 700 16px var(--font-figure); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { height: 36px; min-width: 44px; padding: 0 12px; border-radius: var(--r-chip); border: 1px solid var(--hairline-strong); font: 600 14px var(--font-sans); color: var(--ink); }
  .chip.on { background: var(--action); color: var(--on-action); border-color: var(--action); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
  .toggle-row span { font: 600 14px var(--font-sans); }
  .toggle-row small { display: block; font: 500 12px var(--font-sans); color: var(--ink-muted); }
  .tg { width: 44px; height: 26px; border-radius: 13px; background: var(--surface-3); position: relative; flex: none; transition: background var(--dur-fast) var(--ease-standard); }
  .tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink-muted); transition: transform var(--dur-fast) var(--ease-standard), background var(--dur-fast); }
  .tg.on { background: var(--action); }
  .tg.on::after { transform: translateX(18px); background: var(--on-action); }
  .tg-hit { padding: 9px 0; }

  /* sheet, toast */
  .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--dur-slow) var(--ease-enter); z-index: 20; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; background: var(--surface-1); border-top: 1px solid var(--hairline-strong); border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 8px 20px 22px; z-index: 21; transform: translateY(100%); transition: transform var(--dur-slow) var(--ease-enter); box-shadow: var(--shadow-3); }
  .sheet.on { transform: none; }
  .sheet .handle { width: 36px; height: 4px; border-radius: 4px; background: var(--hairline-strong); margin: 0 auto 12px; }
  .sheet .eyebrow { font: 600 12px/1.3 var(--font-sans); color: var(--ink-muted); }
  .sheet h2 { font: 700 26px/1.08 var(--font-display); font-stretch: var(--display-stretch); letter-spacing: -0.5px; margin: 2px 0 14px; }
  .sheet h3 { font: 700 15px/1.3 var(--font-sans); margin: 20px 0 6px; }
  .sheet p { font-size: 14px; color: var(--ink-muted); margin: 0 0 10px; }
  .sheet .shead { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hairline); min-height: 52px; }
  .opt > div { min-width: 0; }
  .opt b { display: block; font: 600 15px/1.35 var(--font-sans); }
  .opt small { display: block; font: 500 12px/1.4 var(--font-sans); color: var(--ink-muted); }
  .opt .btn { width: auto; min-height: 40px; font-size: 14px; flex: none; }
  .anchor { background: var(--anchor); color: var(--on-anchor); border-radius: var(--r-anchor); box-shadow: var(--shadow-anchor); padding: 16px 18px; margin: 4px 9px 22px 0; animation: anchorIn var(--dur-slow) var(--ease-enter); }
  @keyframes anchorIn { from { transform: translateY(var(--rise-anchor)); opacity: 0; box-shadow: 0 0 0 transparent; } }
  .anchor .cap { font: 600 12px/1.3 var(--font-sans); color: var(--on-anchor-muted); }
  .anchor .big { font: 700 56px/1 var(--font-display); font-stretch: var(--display-stretch); letter-spacing: -1.5px; color: var(--on-anchor-accent); margin: 6px 0 4px; }
  .anchor .big small { font-size: 22px; letter-spacing: 0; color: var(--on-anchor-muted); margin-left: 4px; }
  .anchor .ln { font: 500 14px/1.45 var(--font-sans); }
  .chg { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--hairline); }
  .chg b { font: 600 14px/1.35 var(--font-sans); }
  .chg span { font: 700 14px/1.35 var(--font-figure); text-align: right; white-space: nowrap; }
  .chg small { grid-column: 1 / -1; font: 500 12px/1.4 var(--font-sans); color: var(--ink-muted); }
  .chg.held span { color: var(--ink-muted); font-weight: 600; }
  .htable { width: 100%; border-collapse: collapse; font: 600 13px var(--font-figure); }
  .htable td, .htable th { padding: 9px 4px; border-bottom: 1px solid var(--hairline); text-align: left; }
  .htable th { font: 600 12px var(--font-sans); color: var(--ink-subtle); }
  .htable td.r, .htable th.r { text-align: right; }
  .htable tr.grp td { font: 600 12px var(--font-sans); color: var(--ink-muted); padding-top: 14px; border-bottom: 0; }
  .htable .mut { color: var(--ink-subtle); font-weight: 500; }
  .chart { display: block; width: 100%; height: auto; margin: 4px 0 2px; }
  .src { font: 500 12px var(--font-sans); color: var(--ink-subtle); margin: 4px 0 6px; }
  .toast { position: absolute; left: 12px; right: 12px; bottom: 190px; background: var(--surface-3); border: 1px solid var(--hairline-strong); border-radius: var(--r-md); padding: 10px 8px 10px 14px; display: flex; align-items: center; gap: 10px; font: 600 14px/1.35 var(--font-sans); color: var(--ink); z-index: 30; opacity: 0; transform: translateY(var(--rise)); pointer-events: none; transition: opacity var(--dur-base) var(--ease-enter), transform var(--dur-base) var(--ease-enter); box-shadow: var(--shadow-3); }
  .toast.on { opacity: 1; transform: none; pointer-events: auto; }
  .toast span { flex: 1; }
  .toast button { font: 700 14px var(--font-sans); padding: 0 10px; min-height: 40px; border-radius: var(--r-sm); }
  input[type=file] { display: none; }
  @media (prefers-reduced-motion: reduce) { .cell.pend::after { animation: none; } }
</style>
</head>
<body>
<div class="phone" id="app" aria-label="Notebook workout prototype">
  <header class="top">
    <div class="weeks" id="weeks" role="tablist" aria-label="Weeks"></div>
    <button class="ib" data-a="menu" id="syncBtn" aria-label="Sync and backup"></button>
    <button class="ib" data-a="edit" id="editBtn" aria-label="Edit program"></button>
    <button class="ib" data-a="menu" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
  </header>
  <nav class="days" id="days" aria-label="Days"></nav>
  <main class="table" id="table"></main>
  <footer class="dock" id="dock"></footer>
  <div class="toast" id="toast" role="status"><span></span><button data-a="toastAct"></button></div>
  <div class="scrim" id="scrim" data-a="close"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  <input type="file" id="fileIn" accept="application/json,.json">
</div>
<aside class="side" id="side">
  <h1>Notebook</h1>
  <div class="seg" id="sideTheme"><button data-t="dark">Dark</button><button data-t="light">Light</button></div>
  <div class="about" id="aboutSide"></div>

    case 'delDay': { const w = liveW(); if (w.days.length < 2) { toast('A week needs at least one day'); break; } const i = S.view.d; const [gone] = w.days.splice(i, 1); S.view.d = 0; markPending(); render(); toast(`${gone.name} deleted`, 'Undo', () => { w.days.splice(i, 0, gone); S.view.d = i; render(); }); break; }
  }
});
app.addEventListener('change', ev => {
  const t = ev.target; if (!t.dataset.in) return;
  if (t.dataset.in === 'dayname') { viewDay().name = t.value.trim() || viewDay().name; markPending(); render(); }
  if (t.dataset.in === 'name') editEx(+t.dataset.e, ex => { ex.name = t.value.trim() || ex.name; });
  if (t.dataset.in === 'load') editEx(+t.dataset.e, ex => { const v = parseFloat(t.value.replace(',', '.')); ex.load = isNaN(v) ? (ex.bw ? 0 : null) : v; });
});
$('#fileIn').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.v === 1 && j.weeks) S = j;
    else if (j._version && j.weeks) { const keepOld = S.old; DATA.current = j.weeks; S = initState(); S.old = keepOld; }
    else throw new Error('format');
    UI.undo = []; closeSheet(); $('#weeks').innerHTML = ''; render(); toast('Backup loaded');
  } catch (err) { toast('That file is not a Calisthenics backup. Pick the JSON from Download.'); }
  ev.target.value = '';
});
document.querySelectorAll('#sideTheme button').forEach(b => b.addEventListener('click', () => { S.prefs.theme = b.dataset.t; render(); }));

const ABOUT = `<ul>
<li><b>Start and Finish are explicit.</b> Start stamps the time and keeps the screen on; Finish stamps the end, shows start, finish and total in the summary and keeps them with the day, so each exercise's history carries its session date and length.</li>
<li><b>Every set keeps the reps you did.</b> A short set stays 7, shown as 7/10, in the table, under next week's set and in the history; next week's targets are worked out from those numbers.</li>
<li><b>One tap logs a set.</b> The big check key at the bottom logs the target into the ringed set; tapping any empty set writes its target too.</li>
<li><b>A short set is one tap.</b> The pad stays docked while you log: tap 7 and the set reads 7 of 10. Two-digit counts take two taps (1, 1); the cell shows the first digit until the second lands.</li>
<li><b>It moves on by itself</b> in pair order (pull-up 1, dip 1, pull-up 2…), so the partner is always the next ring, named in the pad.</li>
<li><b>The rest timer starts itself</b> after every set: 90 s inside a pair, 120 s before a new exercise; it vibrates at zero. Tap it to stop or restart.</li>
<li><b>Undo</b> is the tall key left of the digits, away from the check key, for a mis-tap. Tap a logged set to fix it with the pad, or clear it.</li>
<li><b>Last week sits under every set</b> in the same column, with last week's load under this week's; a grey number turns white when you beat it at the same load. Week 1 of this program has no last week in the table: the old 5-day weeks (a different program, heavier, before the month off) open from each exercise's history.</li>
<li><b>The screen stays on</b> from the first set until the day is finished (Wake Lock), so a glance needs no unlock.</li>
<li><b>Thumb zone:</b> everything you touch between sets is in the lower third; the pad folds away with one tap on the exercise name to show the whole day.</li>
<li><b>Same table, three jobs:</b> the week strip opens past weeks in this layout, the pencil turns it into the program editor, tapping a name opens its history.</li>
</ul>
<h2>Tried and dropped</h2><ul>
<li><b>Keys around the target</b> (for 10 reps: 2–9, 11, 12) instead of digits. Day A took 24 taps instead of 30, but the keys moved with every exercise, so the thumb could not learn them, and 15 of 12 on calf raise could not be entered at all.</li>
<li><b>Tap again to count down</b> (10, 9, 8, 7): 7 of 10 costs four taps.</li>
<li><b>Old 5-day weeks under week 1's sets</b>: a different program at heavier loads with no per-set reps, so 60 kg over 70 read like a drop. They live in the history instead.</li></ul>
<h2>Faked here</h2><ul><li>GitHub push (a short "Pushing…" then "Pushed"). Backup download and upload are real. Data stays in this browser under a prototype-only key.</li></ul>`;
$('#aboutSide').innerHTML = ABOUT;
render();
</script>
</body>
