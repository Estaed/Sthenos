<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<link rel=manifest href=manifest.webmanifest><title>Rest alert test</title>
<style>body{font:16px system-ui;margin:16px;background:#fff;color:#111}button{font-size:18px;padding:14px;margin:6px 0;width:100%}pre{white-space:pre-wrap;background:#eee;padding:8px}</style>
<button id=perm>1. Allow notifications</button>
<label><input type=checkbox id=wl> Keep screen awake (Wake Lock)</label>
<button id=go>2. Start 60 s rest</button>
<button id=clr>Clear log</button>
<pre id=log></pre>
<script>
const L=k=>{const s=(localStorage.log||'')+new Date().toLocaleTimeString()+' '+k+'\n';localStorage.log=s;log.textContent=s};
log.textContent=localStorage.log||'';
navigator.serviceWorker.register('sw.js');
let ctx, lock=null;
perm.onclick=async()=>{L('permission: '+await Notification.requestPermission()); ctx=ctx||new AudioContext(); ctx.resume()};
async function getLock(){try{lock=await navigator.wakeLock.request('screen');L('wake lock ON');lock.onrelease=()=>L('wake lock released (vis='+document.visibilityState+')')}catch(e){L('wake lock error '+e.name)}}
wl.onchange=()=>wl.checked?getLock():lock&&lock.release();
document.addEventListener('visibilitychange',()=>{L('visibility '+document.visibilityState); if(wl.checked&&document.visibilityState==='visible')getLock()});
function beep(){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=.4;o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.6)}
go.onclick=async()=>{
  ctx=ctx||new AudioContext(); await ctx.resume();
  const end=Date.now()+60000; L('start, ends '+new Date(end).toLocaleTimeString());
  (await navigator.serviceWorker.ready).active.postMessage({end});
  setTimeout(async()=>{
    L('PAGE timer fired, late '+(Date.now()-end)+' ms, vis='+document.visibilityState+', audio='+ctx.state);
    beep(); L('vibrate() returned '+navigator.vibrate([400,200,400]));
    (await navigator.serviceWorker.ready).showNotification('Rest over (page)',{tag:'rest-page',requireInteraction:true,renotify:true});
  },60000);
};
navigator.serviceWorker.onmessage=e=>L(e.data);
</script>
