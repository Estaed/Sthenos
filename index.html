<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">

<meta http-equiv="Expires" content="0">
<title>Calisthenic Program</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
:root {
  --bg: #0f0f0f;
  --card: #1a1a1a;
  --card2: #222;
  --text: #e8eaed;
  --text2: #9aa0a6;
  --border: #2a2a2a;
  --green: #34a853;
  --green-bg: #152b1c;
  --orange: #f9ab00;
  --orange-bg: #2d2010;
  --blue: #4a9eff;
  --blue-bg: #0d1f33;
  --radius: 12px;
  --radius-sm: 8px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(72px + var(--safe-bottom));
}

.scroll-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 12px 8px;
  scrollbar-width: none;
  -ms-overflow-style: none;
  background: var(--bg);
}
.scroll-row::-webkit-scrollbar { display: none; }

.stage-bar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px;
}
.stage-bar .scroll-row { padding: 0; background: transparent; }

.sbtn {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
}
.sbtn.s0.on { background: var(--green-bg); color: var(--green); border-color: #2e7d32; }
.sbtn.s1.on { background: var(--orange-bg); color: var(--orange); border-color: #b45309; }
.sbtn.s2.on { background: #2a1515; color: #ea4335; border-color: #c5221f; }

.week-nav-wrap {
  position: sticky;
  top: 49px;
  z-index: 30;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

.pill, .dpill {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text2);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
}
.pill.on, .dpill.on {
  background: #2a2a2a;
  border-color: #555;
  color: var(--text);
  font-weight: 700;
}
.pill.done, .dpill.done { background: var(--green-bg); border-color: #2e7d32; color: var(--green); }
.pill.partial, .dpill.partial { background: var(--orange-bg); border-color: #b45309; color: var(--orange); }

.content { padding: 0 12px; }

.card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  padding: 14px 16px;
  margin-bottom: 12px;
}

.tipbox {
  background: var(--blue-bg);
  border: 1px solid #1e3d6e;
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 12px;
  font-size: 13px;
  color: #b8d0f0;
  line-height: 1.6;
}
.tipbox strong { color: #90c0ff; }
.cali-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #1a3a5c;
  border: 1px solid #2e5c94;
  border-radius: 20px;
  padding: 4px 10px;
  color: #7eb8ff;
  font-weight: 600;
  font-size: 12px;
  text-decoration: none;
  margin: 6px 0 8px;
}
.cali-link:hover { background: #254d7a; }

.week-hdr { margin-bottom: 12px; }
.wfocus { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.wnote { font-size: 13px; color: var(--text2); line-height: 1.7; }
.caliref {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: var(--orange);
  font-weight: 500;
  text-decoration: none;
  font-size: 12px;
}
.caliref:hover { text-decoration: underline; }

.warmup-btn {
  width: 100%;
  text-align: left;
  padding: 13px 0;
  background: none;
  border: none;
  border-bottom: 1px solid var(--border);
  color: var(--text2);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.warmup-btn span:first-child { font-weight: 500; }
.warmup-arrow { font-size: 16px; transition: transform .2s; }
.warmup-arrow.open { transform: rotate(180deg); }
.wlist { display: none; padding: 8px 0 4px; margin-bottom: 8px; }
.wlist.open { display: block; }
.wi {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 14px;
  border-bottom: 1px solid var(--border);
}
.win { color: var(--text2); flex: 1; }
.wid { color: var(--text); font-size: 13px; text-align: right; max-width: 45%; }

.day-info { font-size: 13px; color: var(--text2); margin-bottom: 10px; font-style: italic; }
.day-done-badge {
  display: inline-block;
  background: var(--green-bg);
  color: var(--green);
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  margin-left: 8px;
  vertical-align: middle;
}

.et { width: 100%; border-collapse: collapse; margin-top: 6px; }
.et th {
  font-size: 11px;
  color: var(--text2);
  text-align: left;
  padding: 8px 6px 8px 0;
  border-bottom: 1px solid var(--border);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.et th:first-child { width: 36px; }
.et th:nth-child(2) { width: 99%; }
.et th:nth-child(3) { width: 34px; white-space: nowrap; }
.et th:nth-child(4) { width: 60px; white-space: nowrap; }

.et td { padding: 11px 6px 11px 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
.et td:first-child { padding-left: 0; }

.et input[type=checkbox] {
  width: 20px;
  height: 20px;
  accent-color: var(--green);
  cursor: pointer;
  flex-shrink: 0;
}
.ex-name { font-weight: 600; font-size: 14px; }
.ex-note { font-size: 12px; color: var(--text2); margin-top: 2px; line-height: 1.4; }
.ex-check-note { font-size: 12px; color: var(--green); margin-top: 2px; font-weight: 500; }
.et td:nth-child(3) { color: var(--text2); font-size: 13px; }
.et td:nth-child(4) { font-size: 13px; font-weight: 500; }

.lu-title {
  font-size: 11px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 10px;
}
.luc {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.luc:last-child { border-bottom: none; }
.lck { color: var(--green); flex-shrink: 0; font-weight: 700; margin-top: 1px; }

.sp { height: 8px; }
</style>
</head>

</div>

// ── State ──
let si = parseInt(localStorage.getItem('si') || '0');
let wi = parseInt(localStorage.getItem('wi') || '0');
let di = parseInt(localStorage.getItem('di') || '0');
let wuOpen = localStorage.getItem('wuOpen') === 'true';

function saveState() {
  localStorage.setItem('si', si);
  localStorage.setItem('wi', wi);
  localStorage.setItem('di', di);
  localStorage.setItem('wuOpen', wuOpen);
}

function getKey(s,w,d,ex){ return `cali_${s}_${w}_${d}_${ex}`; }
function isChecked(s,w,d,ex){ return localStorage.getItem(getKey(s,w,d,ex))==='1'; }
function setChecked(s,w,d,ex,val){ localStorage.setItem(getKey(s,w,d,ex),val?'1':'0'); }

function calcWeekStats(s,w){
  let total=0, done=0;
  ST[s].weeks[w].days.forEach((d,di)=>{ d.ex.forEach((_,ex)=>{ total++; if(isChecked(s,w,di,ex)) done++; }); });
  return {total,done};
}
function calcDayStats(s,w,d){
  let total=0, done=0;
  ST[s].weeks[w].days[d].ex.forEach((_,ex)=>{ total++; if(isChecked(s,w,d,ex)) done++; });
  return {total,done};
}

function render(){
  const s=ST[si], w=s.weeks[wi], d=w.days[Math.min(di, w.days.length-1)];

  document.getElementById('weekNav').innerHTML = s.weeks.map((wk,i)=>{
    const stat=calcWeekStats(si,i);
    let cls='pill'; if(i===wi) cls+=' on';
    if(stat.total>0 && stat.done===stat.total) cls+=' done';
    else if(stat.done>0) cls+=' partial';
    return `<button class="${cls}" onclick="selW(${i})">H${wk.n}</button>`;
  }).join('');

  document.getElementById('dayTabs').innerHTML = w.days.map((day,j)=>{
    const stat=calcDayStats(si,wi,j);
    let cls='dpill'; if(j===di) cls+=' on';
    if(stat.total>0 && stat.done===stat.total) cls+=' done';
    else if(stat.done>0) cls+=' partial';
    return `<button class="${cls}" onclick="selD(${j})">${day.l}</button>`;
  }).join('');

  const allChecked = d.ex.every((_,idx) => isChecked(si,wi,di,idx));
  const doneBadge = allChecked ? '<span class="day-done-badge">✅ Gün Tamamlandı</span>' : '';
  document.getElementById('dinfo').innerHTML = d.i + doneBadge;

  let noteHtml = (w.note||'').replace(/\n/g,'<br>');
  noteHtml = noteHtml.replace(/📺 (Calihoss:[^\n<]*)/g,
    '<a class="caliref" href="https://calihoss.me/learn/calisthenics" target="_blank" rel="noopener">📺 $1</a>');
  document.getElementById('weekHdr').innerHTML =
    `<div class="wfocus">${w.f}</div><div class="wnote">${noteHtml||''}</div>`;

  document.getElementById('wtit').textContent = 'Isınma — '+WN[d.w];
  document.getElementById('wlist').innerHTML = WU[d.w].map(([n,det])=>
    `<div class="wi"><span class="win">${n}</span><span class="wid">${det}</span></div>`
  ).join('');

  document.getElementById('exb').innerHTML = d.ex.map(([nm,sets,reps,note],idx)=>{
    const checked = isChecked(si,wi,di,idx);
    const noteHtml2 = note
      ? (note.startsWith('✓')
          ? `<div class="ex-check-note">${note}</div>`
          : `<div class="ex-note">${note}</div>`)
      : '';
    return `<tr>
      <td><input type="checkbox" ${checked?'checked':''} onchange="setChecked(${si},${wi},${di},${idx},this.checked);render()" id="cb_${idx}"></td>
      <td><label for="cb_${idx}" class="ex-name">${nm}</label>${noteHtml2}</td>
      <td>${sets}</td>
      <td>${reps}</td>
    </tr>`;
  }).join('');

  document.getElementById('lubox').innerHTML = `
    <div class="lu-title">Level-up Kriterleri</div>
    ${s.lu.map(c=>`<div class="luc"><span class="lck">✓</span><span>${c}</span></div>`).join('')}`;
}

function selW(i){wi=i;di=0;saveState();render();}
function selD(i){di=i;saveState();render();}

function toggleW(){
  wuOpen=!wuOpen;
  document.getElementById('wlist').className='wlist'+(wuOpen?' open':'');
  document.getElementById('warr').className='warmup-arrow'+(wuOpen?' open':'');
  saveState();
}

function selS(i){
  si=i; wi=0; di=0;
  document.querySelectorAll('.sbtn').forEach((b,j)=>{
    b.className=`sbtn s${j}${j===i?' on':''}`;
  });
  saveState();
  render();
}

document.getElementById('stages').innerHTML = ST.map((s,i)=>
  `<button class="sbtn s${i}${i===si?' on':''}" onclick="selS(${i})"><strong>${s.name}</strong> — ${s.lbl}</button>`
).join('');

if(wuOpen){ document.getElementById('wlist').className='wlist open'; document.getElementById('warr').className='warmup-arrow open'; }

render();
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(registrations => {
      registrations.forEach(reg => reg.unregister());
    }).then(() => {
      caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))));
    }).finally(() => {
      navigator.serviceWorker.register('sw.js?v=3')
        .then(reg => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                if (confirm('Yeni güncelleme var! Şimdi yenilensin mi?')) {
                  window.location.reload();
                }
              }
            });
          });
        })
        .catch(err => console.log('SW kaydı başarısız:', err));
    });
  }
</script>
