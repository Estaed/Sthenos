<!-- iOS Safari PWA desteği -->
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root {
  --bg: #121212;
  --card: #1e1e1e;
  --text: #e8eaed;
  --text2: #9aa0a6;
  --border: #333;
  --green: #34a853;
  --green-bg: #1a3520;
  --orange: #f9ab00;
  --orange-bg: #3e2f14;
  --radius: 10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:12px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto}
.stages{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sbtn{padding:10px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:14px;font-weight:500;cursor:pointer}
.sbtn.s0.on{background:var(--green-bg);color:var(--green);border-color:#2e7d32}
.sbtn.s1.on{background:var(--orange-bg);color:var(--orange);border-color:#b45309}
.sbtn.s2.on{background:#381c1c;color:#ea4335;border-color:#c5221f}
.card{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:14px 16px;margin-bottom:14px}
.pill-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none}
.pill-row::-webkit-scrollbar{display:none}
.pill,.dpill{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.pill.on,.dpill.on{background:#333;border-color:#555;color:var(--text);font-weight:bold}
.pill.done,.dpill.done{background:var(--green-bg);border-color:#2e7d32;color:var(--green)}
.pill.partial,.dpill.partial{background:var(--orange-bg);border-color:#b45309;color:var(--orange)}
.wfocus{font-size:17px;font-weight:600;margin-bottom:4px}
.wnote{font-size:14px;color:var(--text2);line-height:1.6}
.wbtn{width:100%;text-align:left;padding:12px 0;background:none;border:none;border-bottom:1px solid var(--border);color:var(--text2);font-size:14px;cursor:pointer;display:flex;justify-content:space-between}
.wlist{display:none;padding:8px 0;margin-bottom:8px}
.wlist.open{display:block}
.wi{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid var(--border)}
.win{color:var(--text2)}.wid{color:var(--text);font-size:13px;text-align:right;max-width:55%}
.et{width:100%;border-collapse:collapse;margin-top:6px}
.et th{font-size:12px;color:var(--text2);text-align:left;padding:8px 4px;border-bottom:1px solid var(--border);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.et td{padding:10px 4px;border-bottom:1px solid var(--border);vertical-align:top;font-size:14px}
.en{font-weight:600}
.emile{font-size:13px;color:var(--green);margin-top:2px;font-weight:500}
.et input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
.dinfo{font-size:13px;color:var(--text2);margin-bottom:12px;font-style:italic}
.luc{font-size:14px;padding:5px 0;display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid var(--border)}
.lck{color:var(--green);flex-shrink:0;font-weight:600}
.done-btn{display:inline-block;margin-top:10px;padding:8px 18px;border-radius:20px;border:1px solid var(--green);background:var(--green-bg);color:var(--green);font-size:13px;font-weight:500;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<div class="stages" id="stages"></div>
<div class="pill-row" id="weekNav"></div>

<div class="dinfo" id="dinfo"></div>
<button class="wbtn" onclick="toggleW()"><span id="wtit">Isınma</span><span id="warr">↓</span></button>
<div class="wlist" id="wlist"></div>
<div class="card" style="margin-top:10px">

  <button class="done-btn" onclick="markDayDone()">✅ Günü Tamamlandı Olarak İşaretle</button>
</div>
<div class="card" id="lubox"></div>
</div>

let si=0, wi=0, di=0, wuOpen=false;

// localStorage
function getKey(s,w,d,ex){ return `cali_${s}_${w}_${d}_${ex}`; }
function isChecked(s,w,d,ex){ return localStorage.getItem(getKey(s,w,d,ex))==='1'; }
function setChecked(s,w,d,ex,val){ localStorage.setItem(getKey(s,w,d,ex),val?'1':'0'); }

function calcWeekStats(s,w){
  let total=0, done=0;
  ST[s].weeks[w].days.forEach((d,di)=>{ d.ex.forEach((_,ex)=>{ total++; if(isChecked(s,w,di,ex)) done++; }); });
  return {total,done};
}
function calcDayStats(s,w,d){
  let total=0, done=0;
  ST[s].weeks[w].days[d].ex.forEach((_,ex)=>{ total++; if(isChecked(s,w,d,ex)) done++; });
  return {total,done};
}
function markDayDone(){
  ST[si].weeks[wi].days[di].ex.forEach((_,idx)=>setChecked(si,wi,di,idx,true));
  render();
}

function render(){
  const s=ST[si], w=s.weeks[wi], d=w.days[Math.min(di,w.days.length-1)];
  document.getElementById('weekNav').innerHTML = s.weeks.map((wk,i)=>{
    const stat=calcWeekStats(si,i);
    let cls='pill'; if(i===wi) cls+=' on';
    if(stat.total>0 && stat.done===stat.total) cls+=' done';
    else if(stat.done>0) cls+=' partial';
    return `<button class="${cls}" onclick="selW(${i})">H${wk.n}</button>`;
  }).join('');
  document.getElementById('dayTabs').innerHTML = w.days.map((day,j)=>{
    const stat=calcDayStats(si,wi,j);
    let cls='dpill'; if(j===di) cls+=' on';
    if(stat.total>0 && stat.done===stat.total) cls+=' done';
    else if(stat.done>0) cls+=' partial';
    return `<button class="${cls}" onclick="selD(${j})">${day.l}</button>`;
  }).join('');
  document.getElementById('dinfo').textContent = d.i;
  document.getElementById('weekHdr').innerHTML = `<div class="wfocus">${w.f}</div><div class="wnote">${w.note||''}</div>`;
  document.getElementById('wtit').textContent = 'Isınma — '+WN[d.w];
  document.getElementById('wlist').innerHTML = WU[d.w].map(([n,det])=>`<div class="wi"><span class="win">${n}</span><span class="wid">${det}</span></div>`).join('');
  document.getElementById('exb').innerHTML = d.ex.map(([nm,sets,reps,note],idx)=>{
    const checked = isChecked(si,wi,di,idx);
    return `<tr>
      <td><input type="checkbox" ${checked?'checked':''} onchange="setChecked(${si},${wi},${di},${idx},this.checked);render()" id="cb_${idx}"></td>
      <td><label for="cb_${idx}" class="en">${nm}</label>${note?`<div class="emile" style="font-size:12px;color:var(--text2)">${note}</div>`:''}</td>
      <td style="color:var(--text2)">${sets}</td>
      <td style="font-weight:500">${reps}</td>
    </tr>`;
  }).join('');
  renderLu();
}
function renderLu(){
  const s=ST[si];
  document.getElementById('lubox').innerHTML=`
    <div style="font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Level-up Kriterleri</div>
    ${s.lu.map(c=>`<div class="luc"><span class="lck">✓</span><span>${c}</span></div>`).join('')}`;
}

function selW(i){wi=i;di=0;render();}
function selD(i){di=i;render();}
function toggleW(){wuOpen=!wuOpen;document.getElementById('wlist').className='wlist'+(wuOpen?' open':'');document.getElementById('warr').textContent=wuOpen?'↑':'↓';}
function selS(i){si=i;wi=0;di=0;document.querySelectorAll('.sbtn').forEach((b,j)=>{b.className=`sbtn s${j}${j===i?' on':''}`;});render();}

document.getElementById('stages').innerHTML=ST.map((s,i)=>`<button class="sbtn s${i}${i===0?' on':''}" onclick="selS(${i})"><strong>${s.name}</strong> — ${s.lbl}</button>`).join('');
render();
</script>

    navigator.serviceWorker.register('sw.js');
  }
</script>
